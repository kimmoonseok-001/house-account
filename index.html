<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <div class="auth-wrap" id="authScreen">
      <div class="card auth-card">
        <h1 class="auth-title"><span class="emoji">💰</span> 나의 가계부</h1>
        <p class="auth-sub">로그인하고 내 가계부 데이터를 안전하게 저장하세요</p>

        <form id="authForm">
          <div class="field-row">
            <label for="authEmail">이메일</label>
            <input type="email" id="authEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="field-row">
            <label for="authPassword">비밀번호</label>
            <input type="password" id="authPassword" placeholder="6자 이상" minlength="6" required autocomplete="current-password">
          </div>
          <p class="auth-error" id="authError"></p>
          <button type="submit" class="submit-btn" id="authSubmitBtn">로그인</button>
        </form>

        <button type="button" class="auth-toggle" id="authToggleMode">계정이 없으신가요? 회원가입</button>
      </div>
    </div>

    <div class="app" id="appRoot" hidden>

      <div class="topbar">
        <span class="user-email" id="userEmail"></span>
        <button type="button" class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <header class="app-header">
        <p class="eyebrow" id="todayDate"></p>
        <h1><span class="emoji">💰</span> 나의 가계부</h1>
      </header>

      <section class="summary-grid">
        <div class="summary-card income">
          <div class="summary-icon">📈</div>
          <div class="summary-body">
            <span class="label">총 수입</span>
            <span class="amount" id="totalIncome">0원</span>
          </div>
        </div>
        <div class="summary-card expense">
          <div class="summary-icon">📉</div>
          <div class="summary-body">
            <span class="label">총 지출</span>
            <span class="amount" id="totalExpense">0원</span>
          </div>
        </div>
        <div class="summary-card balance">
          <div class="summary-icon">✨</div>
          <div class="summary-body">
            <span class="label">잔액</span>
            <span class="amount" id="totalBalance">0원</span>
          </div>
        </div>
      </section>

      <section class="content-grid">
        <div class="card form-card">
          <h2>새 항목 추가</h2>
          <form id="entryForm">
            <div class="type-toggle" id="typeToggle">
              <button type="button" class="type-btn expense active" data-type="expense">📉 지출</button>
              <button type="button" class="type-btn income" data-type="income">📈 수입</button>
            </div>
            <input type="hidden" id="type" value="expense">

            <div class="field-row">
              <label for="date">날짜</label>
              <input type="date" id="date" required>
            </div>

            <div class="field-row">
              <label for="category">카테고리</label>
              <input type="text" id="category" placeholder="예: 식비, 교통" required autocomplete="off">
            </div>
            <div class="quick-chips" id="quickChips"></div>

            <div class="field-row">
              <label for="amount">금액</label>
              <input type="number" id="amount" placeholder="0" min="0" required>
            </div>

            <div class="field-row">
              <label for="memo">메모</label>
              <input type="text" id="memo" placeholder="선택 사항">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">추가하기</button>
          </form>
        </div>

        <div class="card chart-card">
          <h2>지출 분석</h2>
          <div class="chart-wrap" id="chartWrap">
            <div class="donut" id="donutChart">
              <div class="donut-center">
                <span id="donutTotal">0원</span>
                <span class="donut-sub">총 지출</span>
              </div>
            </div>
            <ul class="legend" id="legendList"></ul>
          </div>
          <p class="empty-chart" id="emptyChart">지출 내역이 없어요</p>
        </div>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>거래 내역</h2>
          <div class="filter-tabs" id="filterTabs">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="income">수입</button>
            <button class="filter-btn" data-filter="expense">지출</button>
          </div>
        </div>
        <ul class="entry-list" id="entryList"></ul>
        <div class="empty" id="emptyMsg">
          <div class="empty-icon">🧾</div>
          <p>아직 기록이 없어요. 위에서 첫 항목을 추가해보세요.</p>
        </div>
      </section>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
